<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>捜索状況共有</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<style>
:root{--bg:#ece8d5;--panel:#f6f3e6;--ink:#1e1c16;--line:#7c7862;--hi:#1e1c16;--hi-ink:#f6f3e6;--warn:#b0361f;--mark:#c0271a;--st0:#c0271a;--st1:#1f7a3a;--st2:#7a776a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1b17;--panel:#2a2823;--ink:#eee9d2;--line:#8f8b76;--hi:#eee9d2;--hi-ink:#1c1b17;--warn:#ff9a80;--mark:#ff8a70;--st0:#ff8a70;--st1:#6fcf7f;--st2:#a29e8a}}
:root[data-theme="dark"]{--bg:#1c1b17;--panel:#2a2823;--ink:#eee9d2;--line:#8f8b76;--hi:#eee9d2;--hi-ink:#1c1b17;--warn:#ff9a80;--mark:#ff8a70;--st0:#ff8a70;--st1:#6fcf7f;--st2:#a29e8a}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.6 "Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;overflow:hidden}
.mono{font-family:"Share Tech Mono",ui-monospace,monospace;letter-spacing:.06em}
button,input{font:inherit;color:inherit}
button{background:none;border:1px solid var(--ink);padding:.55em 1.1em;cursor:pointer;position:relative}
button:hover,button:focus-visible,button.on{background:var(--hi);color:var(--hi-ink);outline:none}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button.solid{background:var(--hi);color:var(--hi-ink)}
button.solid:hover{background:none;color:var(--ink)}
input{width:100%;background:none;border:0;border-bottom:1px solid var(--ink);padding:.5em .1em;border-radius:0}
input:focus{outline:none;background:var(--panel)}
label{display:block;font-size:12px;opacity:.75;margin:1.1em 0 0}
.hide{display:none!important}
#auth{height:100%;display:grid;place-items:center;padding:20px;background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(120,116,96,.08) 6px 7px)}
.box{width:min(380px,100%);background:var(--panel);border:1px solid var(--ink);padding:28px 26px 24px;position:relative}
.box::before{content:"";position:absolute;inset:4px;border:1px solid var(--line);pointer-events:none}
.box h1{font-size:19px;margin:0 0 18px;font-weight:700}
.box h1::before,header h1::before{content:"■";font-size:.6em;margin-right:.6em;vertical-align:.15em}
.tabs{display:flex;gap:6px;margin-bottom:6px}
.tabs button{flex:1;border-color:var(--line)}
.err{color:var(--warn);min-height:1.5em;font-size:13px;margin-top:.8em}
.box .go{width:100%;margin-top:.6em}
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--ink);box-shadow:0 3px 0 -2px var(--bg),0 4px 0 -2px var(--ink);background:var(--panel);position:relative;z-index:2}
header h1{font-size:16px;margin:0;font-weight:700}
header .r{display:flex;align-items:center;gap:10px;font-size:13px}
header button{padding:.3em .8em;font-size:12px}
#stage{position:relative;flex:1;min-height:0}
#map{width:100%;height:100%;background:var(--bg);z-index:0}
.leaflet-div-icon{background:none;border:none}
.pin-ic text{fill:var(--ink);font-family:"Share Tech Mono",monospace;paint-order:stroke;stroke:var(--panel);stroke-width:3px;stroke-linejoin:round;font-weight:700}
.leaflet-control-attribution{background:var(--panel)!important;color:var(--ink)!important;font-size:10px}
.leaflet-control-attribution a{color:var(--ink)!important}
.leaflet-control-scale-line{background:var(--panel)!important;border-color:var(--ink)!important;color:var(--ink)!important}
:root[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9)}}
.cnt{position:absolute;left:12px;top:12px;background:var(--panel);border:1px solid var(--ink);padding:6px 10px;display:flex;gap:14px;font-size:13px;z-index:1001}
.cnt span{display:flex;align-items:center;gap:6px}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;z-index:1001}
.zoom button{width:38px;height:38px;padding:0;background:var(--panel)}
.zoom button:hover{background:var(--hi)}
.hint{position:absolute;left:50%;top:64px;transform:translateX(-50%);background:var(--hi);color:var(--hi-ink);padding:4px 14px;font-size:13px;pointer-events:none;z-index:1001}
.bar{display:flex;gap:10px;padding:12px 14px;background:var(--panel);border-top:1px solid var(--ink)}
.bar button{flex:1;padding:.8em 0}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--panel);border-top:1px solid var(--ink);padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px));z-index:1002;box-shadow:0 -6px 0 -3px var(--bg)}
@media (min-width:720px){.sheet{left:auto;width:380px;top:0;max-height:none;border-left:1px solid var(--ink);border-top:0;box-shadow:none}}
.sheet h2{font-size:15px;margin:0 0 4px;font-weight:700}
.sheet .co{font-size:12px;opacity:.7}
.seg{display:flex;gap:6px;margin-top:6px}
.seg button{flex:1;padding:.5em 0;font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.step{display:flex;align-items:center;gap:10px}
.step button{width:34px;height:34px;padding:0}
.step b{min-width:1.6em;text-align:center;font-size:18px}
.acts{display:flex;gap:8px;margin-top:20px}
.acts button{flex:1}
.acts .del{flex:0 0 auto;color:var(--warn);border-color:var(--warn)}
.acts .del:hover{background:var(--warn);color:var(--hi-ink)}
.toast{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);background:var(--hi);color:var(--hi-ink);padding:6px 16px;font-size:13px;z-index:1004;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(12px);opacity:0}}}
body{font-size:16px}
label{opacity:.9;font-size:13px;font-weight:700}
button{border-width:2px;font-weight:700;min-height:44px}
header button{min-height:36px}
.zoom button{width:44px;height:44px}
.step button{width:44px;height:44px}
.bar button{font-size:16px}
input{font-size:16px;border-bottom-width:2px}
#who{max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet{padding:0 18px calc(16px + env(safe-area-inset-bottom,0px))}
.sh-top{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:8px;background:var(--panel);padding:12px 0 10px;border-bottom:2px solid var(--ink)}
.sh-top h2{flex:1;margin:0}
.sh-top button{padding:.4em 1em}
.acts .del{flex:1}
.modal{position:fixed;inset:0;z-index:1005;display:grid;place-items:center;padding:20px;background:rgba(20,18,12,.55)}
.qr{background:#fff;padding:8px;width:fit-content;margin:6px auto 14px;border:2px solid var(--ink)}
.qr svg{display:block;width:min(220px,55vw);height:auto}
.mrow{display:flex;gap:8px;margin-top:12px}
.mrow button{flex:1}
.cnt span{cursor:pointer}
.cnt span:hover{opacity:.75}
.listpanel{position:absolute;left:12px;top:58px;width:220px;max-height:60%;overflow:auto;background:var(--panel);border:2px solid var(--ink);z-index:1003}
.lp-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-bottom:2px solid var(--ink);position:sticky;top:0;background:var(--panel)}
.lp-top b{font-size:13px}
.lp-top button{padding:.2em .7em;font-size:12px;min-height:auto}
.lp-row{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);padding:8px 10px;background:none;font-size:13px}
.lp-row:hover{background:var(--hi);color:var(--hi-ink)}
.lp-empty{padding:10px;opacity:.7;font-size:13px}
/* ---------- v2 ---------- */
.tl{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;z-index:1001;max-width:calc(100% - 80px)}
.tl .cnt{position:static;flex-wrap:wrap}
.tl2{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap}
select{font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:var(--panel);border:2px solid var(--ink);padding:4px 6px;border-radius:0;max-width:11em}
.net{display:flex;align-items:center;gap:6px;background:var(--panel);border:2px solid var(--ink);padding:3px 8px;font-size:12px}
.net i{width:9px;height:9px;border-radius:50%;background:var(--st1);display:inline-block}
.net.off i{background:var(--warn)}
.net.off{color:var(--warn);border-color:var(--warn)}
.net b{color:var(--warn)}
.listpanel{top:auto}
.srch{position:absolute;left:12px;right:12px;top:12px;max-width:440px;background:var(--panel);border:2px solid var(--ink);z-index:1003;padding:10px 12px;max-height:70%;overflow:auto}
.srch form{display:flex;gap:8px;align-items:flex-end}
.srch form button{flex:0 0 auto;min-height:40px;padding:.3em .9em}
.srch .msg{font-size:13px;opacity:.75;padding:8px 2px 0}
.srch .lp-row{padding:10px 4px}
textarea{width:100%;font:inherit;font-size:16px;color:inherit;background:none;border:2px solid var(--line);padding:.4em;border-radius:0;min-height:4.5em;resize:vertical}
textarea:focus{outline:none;border-color:var(--ink);background:var(--bg)}
input[type=datetime-local]{font-size:15px;padding:.3em 0}
.two{display:flex;gap:12px}
.two>div{flex:1;min-width:0}
.trow{display:flex;gap:6px;align-items:flex-end}
.trow input{flex:1;min-width:0}
.trow button,.lbtn{min-height:34px;padding:.15em .7em;font-size:13px;flex:0 0 auto}
.lrow{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.lrow label{margin-top:1.1em}
.warnbox{margin-top:10px;border:2px solid var(--warn);color:var(--warn);padding:8px 10px;font-size:13px}
.warnbox button{display:block;width:100%;text-align:left;margin-top:6px;min-height:36px;padding:.2em .6em;font-size:13px;color:var(--ink);border-color:var(--warn)}
.meta{font-size:12px;opacity:.8;margin-top:6px;line-height:1.5}
.tag{display:inline-block;border:1px dashed var(--warn);color:var(--warn);font-size:11px;padding:0 6px;margin-left:6px;vertical-align:2px}
.bar button{font-size:15px;line-height:1.25;padding:.6em .2em}
#map.photo .leaflet-tile-pane{filter:none!important}
@media (max-width:460px){header h1{display:none}header .r{gap:6px;width:100%;justify-content:flex-end}}
</style>
</head>
<body>

<section id="auth">
  <div class="box">
    <h1 data-i18n="title"></h1>

    <div class="err" id="err" role="alert"></div>
    <button class="solid go" id="go" type="button"></button><button class="go" id="shA" type="button" style="border-color:var(--line)" data-i18n="shareQR"></button>

</section>

  return fetch(url,{method:method,headers:h,body:body?JSON.stringify(body):undefined})

/* ---------- 同期（10秒ごとの自動更新 + オフライン時の未送信キュー） ---------- */
function qKey(){return "ss_queue_"+(user?user.id:"")}
function queue(){return S.get(qKey())||[]}
function setQueue(q){S.set(qKey(),q)}
function pinBody(d){return{lat:d.lat,lng:d.lng,name:d.name,status:d.status,go:d.go,live:d.live,dead:d.dead,missing:d.missing,
  hazard:d.hazard||"",address:d.address||"",floor:d.floor||"",note:d.note||"",startAt:d.startAt||null,endAt:d.endAt||null}}
function isTmp(id){return typeof id==="string"&&id.indexOf("tmp-")===0}
function enqueue(d){
  var q=queue(),body=pinBody(d),i;
  if(!d.id||isTmp(d.id)){
    if(!d.id)d.id="tmp-"+Date.now();
    for(i=0;i<q.length;i++)if(q[i].tmp===d.id){q[i].body=body;break}
    if(i===q.length)q.push({op:"create",tmp:d.id,body:body});
  }else{
    for(i=0;i<q.length;i++)if(q[i].op==="update"&&q[i].id===d.id){q[i].body=body;break}
    if(i===q.length)q.push({op:"update",id:d.id,body:body});
  }
  setQueue(q);
}
function withQueue(list){
  var q=queue(),byId={};
  list.forEach(function(p){byId[p.id]=p});
  q.forEach(function(e){
    if(e.op==="update"&&byId[e.id]){var p=byId[e.id];for(var k in e.body)p[k]=e.body[k];p._pending=true}
    if(e.op==="create"){var n=JSON.parse(JSON.stringify(e.body));n.id=e.tmp;n.team=user.team;n.by=user.id;n._pending=true;list.push(n)}
  });
  return list;
}
var flushing=null;
function flush(){
  if(flushing)return flushing;
  var q=queue();if(!q.length||!user)return Promise.resolve(false);
  var sentAny=false;
  flushing=q.reduce(function(prev,e){
    return prev.then(function(stop){
      if(stop)return true;
      var req=e.op==="create"?api("POST","/api/pins",e.body):api("PUT","/api/pins/"+e.id,e.body);
      return req.then(function(){drop(e);sentAny=true;return false},function(err){
        if(err&&err._net)return true;               // まだオフライン → 次回再送
        if(err&&err._status===401)return true;
        drop(e);return false;                        // 400/404等は再送しても無駄なので破棄
      });
    });
  },Promise.resolve(false)).then(function(){flushing=null;if(sentAny)toast(t("sent"));return sentAny});
  function drop(e){setQueue(queue().filter(function(x){return !(x.op===e.op&&(x.tmp||x.id)===(e.tmp||e.id))}))}
  return flushing;
}
function sync(){
  if(!user)return;
  flush().then(function(){
    return api("GET","/api/pins").then(function(list){
      online=true;lastSync=Date.now();
      if(draft&&typeof draft.id==="number"&&!draft._warned){
        var cur=list.filter(function(p){return p.id===draft.id})[0];
        if(cur&&cur.t>draft.t&&cur.updatedBy!==user.id){draft._warned=true;toast(t("otherUpdated"),4000)}
      }
      pins=withQueue(list);render();renderNet();
    },function(e){
      if(e&&e._status===401){toast(t("sessionExpired"));logout();return}
      if(e&&e._net){online=false;pins=withQueue(pins.filter(function(p){return !p._pending||!isTmp(p.id)}));render();renderNet();return}
      toast(t("loadFail"));
    });
  });
}
function renderNet(){
  var n=queue().length,el=$("net");
  el.classList.toggle("off",!online);
  el.innerHTML='<i></i><span>'+esc(online?t("synced",{time:lastSync?new Date(lastSync).toLocaleTimeString(t("locale"),{hour:"2-digit",minute:"2-digit",second:"2-digit"}):"--"}):t("offline"))+'</span>'+
    (n?' <b>'+esc(t("pending",{n:n}))+'</b>':'');
}

/* ---------- geo ---------- */
function getPos(){return new Promise(function(res,rej){
  if(!navigator.geolocation)return rej();
  navigator.geolocation.getCurrentPosition(function(p){res({lat:p.coords.latitude,lng:p.coords.longitude})},rej,{enableHighAccuracy:true,timeout:8000,maximumAge:5000})})}
function locate(center){
  getPos().then(function(p){
    gps=p;showGps(p);
    if(center)map.setView([p.lat,p.lng],Math.max(map.getZoom(),17));
  },function(){gps=null;if(!center)toast(t("gpsFail"))});
}
function distM(a,b){
  var R=6371000,r=Math.PI/180,dLat=(b.lat-a.lat)*r,dLng=(b.lng-a.lng)*r;
  var h=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return 2*R*Math.asin(Math.sqrt(h));
}

    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'}),

};
var LAYER_KEYS={osm:"layerOsm",std:"layerStd",pale:"layerPale",photo:"layerPhoto"};
var baseKey=LAYERS[S.get("ss_layer")]?S.get("ss_layer"):"osm";
function setBase(k){
  if(!LAYERS[k])k="osm";
  Object.keys(LAYERS).forEach(function(x){if(x!==k&&map.hasLayer(LAYERS[x]))map.removeLayer(LAYERS[x])});
  if(!map.hasLayer(LAYERS[k]))LAYERS[k].addTo(map);
  baseKey=k;S.set("ss_layer",k);
  $("map").classList.toggle("photo",k==="photo"); // 航空写真は夜テーマでも色を反転しない
}
function renderLayerSelect(){
  $("ml").innerHTML=Object.keys(LAYERS).map(function(k){return '<option value="'+k+'"'+(k===baseKey?" selected":"")+'>'+esc(t(LAYER_KEYS[k]))+'</option>'}).join("");
}
$("ml").onchange=function(){setBase(this.value)};
setBase(baseKey);

var gpsMarker=null;

function glyph(st,r,col){
  col=col||"var(--ink)";
  var p="0,"+-r+" "+r+",0 0,"+r+" "+-r+",0",q=(r*.5);
  var out='<polygon points="'+p+'" fill="'+(st===2?col:"var(--bg)")+'" stroke="'+col+'" stroke-width="1.6"/>';
  if(st===1)out+='<polygon points="0,'+-q+' '+q+',0 0,'+q+' '+-q+',0" fill="'+col+'"/>';
  return out;
}
function pinSVG(p,detailed){
  var st=+p.status,col="var(--st"+(st>=0&&st<=2?st:1)+")",dash=p._pending?' stroke-dasharray="4 3"':'';
  if(!detailed)return '<svg width="20" height="20" viewBox="-10 -10 20 20"><circle r="7" fill="'+col+'" stroke="'+(p._pending?"var(--warn)":"var(--bg)")+'" stroke-width="2"'+dash+'/></svg>';
  var q=18,tx=function(x,y,z,v,al){return '<text x="'+x+'" y="'+y+'" text-anchor="'+(al||"middle")+'" font-size="'+z+'">'+esc(v)+'</text>'};
  return '<svg width="76" height="100" viewBox="-38 -38 76 100" style="overflow:visible">'+
    '<rect x="'+-q+'" y="'+-q+'" width="'+2*q+'" height="'+2*q+'" fill="var(--panel)" stroke="'+col+'" stroke-width="4"'+dash+'/>'+
    tx(0,-5,10,(p.team||"").slice(0,3))+'<g transform="translate(0,8)">'+glyph(st,6,col)+'</g>'+
    tx(0,-25,11,(p.hazard||"").slice(0,6))+tx(-23,5,13,"L"+(p.live||0),"end")+tx(23,5,13,"D"+(p.dead||0),"start")+tx(0,36,13,"M"+(p.missing||0))+
    tx(0,53,12,(p.name||"")+(p.floor?" "+p.floor:""))+'</svg>';
}
function pinIcon(p,detailed){
  return L.divIcon({html:pinSVG(p,detailed),className:"pin-ic",iconSize:detailed?[76,100]:[20,20],iconAnchor:detailed?[38,38]:[10,10]});
}
function visible(){
  if(teamFilter==="all")return pins;
  var tm=teamFilter==="mine"?(user&&user.team):teamFilter.slice(5);
  return pins.filter(function(p){return p.team===tm});
}
function renderFilter(){
  var teams={};pins.forEach(function(p){if(p.team)teams[p.team]=1});
  var opts=[["all",t("allTeams")],["mine",t("myTeam")]].concat(Object.keys(teams).sort().map(function(x){return["team:"+x,x]}));
  if(!opts.some(function(o){return o[0]===teamFilter}))opts.push([teamFilter,teamFilter.slice(5)]);
  $("tf").innerHTML=opts.map(function(o){return '<option value="'+esc(o[0])+'"'+(o[0]===teamFilter?" selected":"")+'>'+esc(o[1])+'</option>'}).join("");
}
$("tf").onchange=function(){teamFilter=this.value;S.set("ss_teamf",teamFilter);closeListPanel();render()};
function render(){
  if(!user)return;
  var detailed=map.getZoom()>=ST_FULL_ZOOM,list=visible();
  markersLayer.clearLayers();
  list.forEach(function(p){
    var m=L.marker([p.lat,p.lng],{icon:pinIcon(p,detailed)});
    m.on("click",function(){
      if($("sheet")){closeSheet();return}
      openSheet(JSON.parse(JSON.stringify(p)));
    });
    markersLayer.addLayer(m);
  });
  if(draft&&!draft.id){
    markersLayer.addLayer(L.marker([draft.lat,draft.lng],{
      interactive:false,
      icon:L.divIcon({html:'<div style="width:36px;height:36px;border:2.5px dashed var(--mark);box-sizing:border-box;border-radius:2px"></div>',className:"pin-ic",iconSize:[36,36],iconAnchor:[18,18]})
    }));
  }
  var n=[0,0,0];list.forEach(function(p){n[+p.status]=(n[+p.status]||0)+1});
  $("cnt").innerHTML=[0,1,2].map(function(i){return '<span data-status="'+i+'"><svg width="12" height="12" viewBox="-7 -7 14 14">'+glyph(i,6,"var(--st"+i+")")+'</svg>'+esc(t("st"+i))+' <b class="mono">'+n[i]+'</b></span>'}).join("");
  renderFilter();
}

function showGps(p){

   seg("status",[[0,"□ "+t("st0")],[1,"◪ "+t("st1")],[2,"■ "+t("st2s")]],d.status)+
   '<label>'+esc(t("entry"))+'</label>'+seg("go",[[true,t("goYes")],[false,t("goNo")]],d.go)+
   stp("missing",t("missing"),d.missing)+stp("live",t("live"),d.live)+stp("dead",t("dead"),d.dead)+
   '<label for="ph">'+esc(t("hazard"))+'</label><input id="ph" placeholder="'+esc(t("hazardPh"))+'">'+
   '<div class="two"><div><label for="ps0">'+esc(t("startT"))+'</label><div class="trow"><input id="ps0" type="datetime-local"><button type="button" data-now="ps0">'+esc(t("now"))+'</button></div></div></div>'+
   '<div class="two"><div><label for="ps1">'+esc(t("endT"))+'</label><div class="trow"><input id="ps1" type="datetime-local"><button type="button" data-now="ps1">'+esc(t("now"))+'</button></div></div></div>'+
   '<label for="pt">'+esc(t("note"))+'</label><textarea id="pt" rows="3" placeholder="'+esc(t("notePh"))+'"></textarea>'+
   (d.id&&(own||isTmp(d.id))?'<div class="acts"><button class="del" id="pd" type="button">'+esc(t("del"))+'</button></div>':'');
  $("stage").appendChild(el);
  // 値はinnerHTMLではなくプロパティで入れる（XSS対策）
  $("pn").value=d.name||"";$("pf").value=d.floor||"";$("pa").value=d.address||"";$("ph").value=d.hazard||"";$("pt").value=d.note||"";
  $("ps0").value=toInput(d.startAt);$("ps1").value=toInput(d.endAt);
  if(isNew&&!d.address)lookupAddress(d,false);
  $("pag").onclick=function(){lookupAddress(d,true)};
  el.addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;
    if(b.hasAttribute("data-near")){var id=b.getAttribute("data-near");var p=pins.filter(function(x){return String(x.id)===id})[0];
      if(p){map.setView([p.lat,p.lng],Math.max(map.getZoom(),18));draft=null;openSheet(JSON.parse(JSON.stringify(p)))}return}
    if(b.hasAttribute("data-now")){$(b.getAttribute("data-now")).value=toInput(Date.now());return}
    var g=b.parentNode.getAttribute("data-k");
    if(b.hasAttribute("data-v")){var v=b.getAttribute("data-v");draft[g]=g==="go"?v==="true":+v;
      Array.prototype.forEach.call(b.parentNode.children,function(x){x.classList.toggle("on",x===b)});
      // 状況に合わせて捜索開始/終了時刻を自動入力（空欄のときだけ）
      if(g==="status"&&draft.status>=1&&!$("ps0").value)$("ps0").value=toInput(Date.now());
      if(g==="status"&&draft.status===2&&!$("ps1").value)$("ps1").value=toInput(Date.now());
    }
    else if(b.hasAttribute("data-d")){draft[g]=Math.max(0,draft[g]+ +b.getAttribute("data-d"));b.parentNode.querySelector("b").textContent=draft[g]}
  });
  $("pc").onclick=function(){closeSheet()};
  $("ps").onclick=save;
  if($("pd"))$("pd").onclick=del;
}
function closeSheet(keep){var s=$("sheet");if(s)s.remove();if(!keep){draft=null;if(user){$("bar").classList.remove("hide");render()}}}
function replaceLocal(oldId,saved){
  var found=false;
  pins=pins.map(function(p){if(p.id===oldId){found=true;return saved}return p});
  if(!found)pins.push(saved);
}
function save(){
  collectForm();
  if(!draft.name)return toast(t("nameReq"));
  var d=draft,body=pinBody(d);
  var offline=function(){enqueue(d);var local=JSON.parse(JSON.stringify(d));local._pending=true;local.team=local.team||user.team;local.by=local.by||user.id;
    replaceLocal(d.id,local);closeSheet();renderNet();toast(t("queued"),3500)};
  if(isTmp(d.id))return offline();               // まだ送信されていないピンの編集
  var req=d.id?api("PUT","/api/pins/"+d.id,body):api("POST","/api/pins",body);
  req.then(function(saved){
    replaceLocal(d.id||saved.id,saved);closeSheet();toast(t("saved"));
  },function(e){
    if(e&&e._net){online=false;return offline()}
    toast(t("saveFail"));
  });
}
function del(){
  var d=draft;
  if(isTmp(d.id)){setQueue(queue().filter(function(e){return e.tmp!==d.id}));pins=pins.filter(function(p){return p.id!==d.id});closeSheet();renderNet();toast(t("deleted"));return}
  api("DELETE","/api/pins/"+d.id).then(function(){
    setQueue(queue().filter(function(e){return e.id!==d.id}));
    pins=pins.filter(function(p){return p.id!==d.id});closeSheet();renderNet();toast(t("deleted"));
  },function(e){toast(e&&e._status===403?t("delForbidden"):e&&e._net?t("delOffline"):t("delFail"))});
}
var tt;function toast(m,ms){var x=document.querySelector(".toast");if(x)x.remove();x=document.createElement("div");x.className="toast";x.textContent=m;$("stage").appendChild(x);clearTimeout(tt);tt=setTimeout(function(){x.remove()},ms||2200)}

/* ---------- テーマ・共有 ---------- */
var th0=S.get("ss_theme");if(th0)document.documentElement.setAttribute("data-theme",th0);
$("th").onclick=function(){var r=document.documentElement,dk=getComputedStyle(r).getPropertyValue("--bg").trim()==="#1c1b17",n=dk?"light":"dark";r.setAttribute("data-theme",n);S.set("ss_theme",n);render()};
var shareOpen=function(){
  var url=location.origin+location.pathname;$("su").value=url;
  var box=$("qrbox");box.innerHTML="";
  try{new QRCode(box,{text:url,width:180,height:180,correctLevel:QRCode.CorrectLevel.M})}
  catch(e){box.textContent=t("qrFail")}
  $("modal").classList.remove("hide");
};
$("zq").onclick=shareOpen;$("shA").onclick=shareOpen;
$("sx").onclick=function(){$("modal").classList.add("hide")};
$("modal").addEventListener("click",function(e){if(e.target===this)this.classList.add("hide")});
$("su").onclick=function(){this.select()};
$("sc").onclick=function(){var b=this,i=$("su");i.select();
  var ok=function(){b.textContent=t("copied");setTimeout(function(){b.textContent=t("copy")},1500)};
  try{navigator.clipboard.writeText(i.value).then(ok,function(){try{document.execCommand("copy")&&ok()}catch(e){}})}catch(e){try{document.execCommand("copy")&&ok()}catch(_){}}};

/* ---------- boot ---------- */
applyI18n();
var ses=S.get("ss_session");
if(ses&&ses.token){enter(ses)}
})();
</script>
