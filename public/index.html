<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>捜索状況共有</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1e1c16">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="捜索共有">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<style>
:root{--bg:#ece8d5;--panel:#f6f3e6;--ink:#1e1c16;--line:#7c7862;--hi:#1e1c16;--hi-ink:#f6f3e6;--warn:#b0361f;--mark:#c0271a;--st0:#c0271a;--st1:#1f7a3a;--st2:#7a776a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1b17;--panel:#2a2823;--ink:#eee9d2;--line:#8f8b76;--hi:#eee9d2;--hi-ink:#1c1b17;--warn:#ff9a80;--mark:#ff8a70;--st0:#ff8a70;--st1:#6fcf7f;--st2:#a29e8a}}
:root[data-theme="dark"]{--bg:#1c1b17;--panel:#2a2823;--ink:#eee9d2;--line:#8f8b76;--hi:#eee9d2;--hi-ink:#1c1b17;--warn:#ff9a80;--mark:#ff8a70;--st0:#ff8a70;--st1:#6fcf7f;--st2:#a29e8a}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.6 "Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;overflow:hidden}
.mono{font-family:"Share Tech Mono",ui-monospace,monospace;letter-spacing:.06em}
button,input{font:inherit;color:inherit}
button{background:none;border:1px solid var(--ink);padding:.55em 1.1em;cursor:pointer;position:relative}
button:hover,button:focus-visible,button.on{background:var(--hi);color:var(--hi-ink);outline:none}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button.solid{background:var(--hi);color:var(--hi-ink)}
button.solid:hover{background:none;color:var(--ink)}
input{width:100%;background:none;border:0;border-bottom:1px solid var(--ink);padding:.5em .1em;border-radius:0}
input:focus{outline:none;background:var(--panel)}
label{display:block;font-size:12px;opacity:.75;margin:1.1em 0 0}
.hide{display:none!important}
#auth{height:100%;display:grid;place-items:center;padding:20px;background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(120,116,96,.08) 6px 7px)}
.box{width:min(380px,100%);background:var(--panel);border:1px solid var(--ink);padding:28px 26px 24px;position:relative}
.box::before{content:"";position:absolute;inset:4px;border:1px solid var(--line);pointer-events:none}
.box h1{font-size:19px;margin:0 0 18px;font-weight:700}
.box h1::before,header h1::before{content:"■";font-size:.6em;margin-right:.6em;vertical-align:.15em}
.tabs{display:flex;gap:6px;margin-bottom:6px}
.tabs button{flex:1;border-color:var(--line)}
.err{color:var(--warn);min-height:1.5em;font-size:13px;margin-top:.8em}
.box .go{width:100%;margin-top:.6em}
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--ink);box-shadow:0 3px 0 -2px var(--bg),0 4px 0 -2px var(--ink);background:var(--panel);position:relative;z-index:2}
header h1{font-size:16px;margin:0;font-weight:700}
header .r{display:flex;align-items:center;gap:10px;font-size:13px}
header button{padding:.3em .8em;font-size:12px}
#stage{position:relative;flex:1;min-height:0}
#map{width:100%;height:100%;background:var(--bg);z-index:0}
.leaflet-div-icon{background:none;border:none}
.pin-ic text{fill:var(--ink);font-family:"Share Tech Mono",monospace;paint-order:stroke;stroke:var(--panel);stroke-width:3px;stroke-linejoin:round;font-weight:700}
.leaflet-control-attribution{background:var(--panel)!important;color:var(--ink)!important;font-size:10px}
.leaflet-control-attribution a{color:var(--ink)!important}
.leaflet-control-scale-line{background:var(--panel)!important;border-color:var(--ink)!important;color:var(--ink)!important}
:root[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9)}}
.cnt{position:absolute;left:12px;top:12px;background:var(--panel);border:1px solid var(--ink);padding:6px 10px;display:flex;gap:14px;font-size:13px;z-index:1001}
.cnt span{display:flex;align-items:center;gap:6px}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;z-index:1001}
.zoom button{width:38px;height:38px;padding:0;background:var(--panel)}
.zoom button:hover{background:var(--hi)}
.hint{position:absolute;left:50%;top:64px;transform:translateX(-50%);background:var(--hi);color:var(--hi-ink);padding:4px 14px;font-size:13px;pointer-events:none;z-index:1001}
.bar{display:flex;gap:10px;padding:12px 14px;background:var(--panel);border-top:1px solid var(--ink)}
.bar button{flex:1;padding:.8em 0}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--panel);border-top:1px solid var(--ink);padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px));z-index:1002;box-shadow:0 -6px 0 -3px var(--bg)}
@media (min-width:720px){.sheet{left:auto;width:380px;top:0;max-height:none;border-left:1px solid var(--ink);border-top:0;box-shadow:none}}
.sheet h2{font-size:15px;margin:0 0 4px;font-weight:700}
.sheet .co{font-size:12px;opacity:.7}
.seg{display:flex;gap:6px;margin-top:6px}
.seg button{flex:1;padding:.5em 0;font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.step{display:flex;align-items:center;gap:10px}
.step button{width:34px;height:34px;padding:0}
.step b{min-width:1.6em;text-align:center;font-size:18px}
.acts{display:flex;gap:8px;margin-top:20px}
.acts button{flex:1}
.acts .del{flex:0 0 auto;color:var(--warn);border-color:var(--warn)}
.acts .del:hover{background:var(--warn);color:var(--hi-ink)}
.toast{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);background:var(--hi);color:var(--hi-ink);padding:6px 16px;font-size:13px;z-index:1004;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(12px);opacity:0}}}
body{font-size:16px}
label{opacity:.9;font-size:13px;font-weight:700}
button{border-width:2px;font-weight:700;min-height:44px}
header button{min-height:36px}
.zoom button{width:44px;height:44px}
.step button{width:44px;height:44px}
.bar button{font-size:16px}
input{font-size:16px;border-bottom-width:2px}
#who{max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet{padding:0 18px calc(16px + env(safe-area-inset-bottom,0px))}
.sh-top{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:8px;background:var(--panel);padding:12px 0 10px;border-bottom:2px solid var(--ink)}
.sh-top h2{flex:1;margin:0}
.sh-top button{padding:.4em 1em}
.acts .del{flex:1}
.modal{position:fixed;inset:0;z-index:1005;display:grid;place-items:center;padding:20px;background:rgba(20,18,12,.55)}
.qr{background:#fff;padding:8px;width:fit-content;margin:6px auto 14px;border:2px solid var(--ink)}
.qr svg{display:block;width:min(220px,55vw);height:auto}
.mrow{display:flex;gap:8px;margin-top:12px}
.mrow button{flex:1}
.cnt span{cursor:pointer}
.cnt span:hover{opacity:.75}
.listpanel{position:absolute;left:12px;top:58px;width:220px;max-height:60%;overflow:auto;background:var(--panel);border:2px solid var(--ink);z-index:1003}
.lp-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-bottom:2px solid var(--ink);position:sticky;top:0;background:var(--panel)}
.lp-top b{font-size:13px}
.lp-top button{padding:.2em .7em;font-size:12px;min-height:auto}
.lp-row{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);padding:8px 10px;background:none;font-size:13px}
.lp-row:hover{background:var(--hi);color:var(--hi-ink)}
.lp-empty{padding:10px;opacity:.7;font-size:13px}
/* ---------- v2 ---------- */
.tl{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;z-index:1001;max-width:calc(100% - 80px)}
.tl .cnt{position:static;flex-wrap:wrap}
.tl2{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap}
select{font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:var(--panel);border:2px solid var(--ink);padding:4px 6px;border-radius:0;max-width:11em}
.net{display:flex;align-items:center;gap:6px;background:var(--panel);border:2px solid var(--ink);padding:3px 8px;font-size:12px}
.net i{width:9px;height:9px;border-radius:50%;background:var(--st1);display:inline-block}
.net.off i{background:var(--warn)}
.net.off{color:var(--warn);border-color:var(--warn)}
.net b{color:var(--warn)}
.listpanel{top:auto}
.srch{position:absolute;left:12px;right:12px;top:12px;max-width:440px;background:var(--panel);border:2px solid var(--ink);z-index:1003;padding:10px 12px;max-height:70%;overflow:auto}
.srch form{display:flex;gap:8px;align-items:flex-end}
.srch form button{flex:0 0 auto;min-height:40px;padding:.3em .9em}
.srch .msg{font-size:13px;opacity:.75;padding:8px 2px 0}
.srch .lp-row{padding:10px 4px}
textarea{width:100%;font:inherit;font-size:16px;color:inherit;background:none;border:2px solid var(--line);padding:.4em;border-radius:0;min-height:4.5em;resize:vertical}
textarea:focus{outline:none;border-color:var(--ink);background:var(--bg)}
input[type=datetime-local]{font-size:15px;padding:.3em 0}
.two{display:flex;gap:12px}
.two>div{flex:1;min-width:0}
.trow{display:flex;gap:6px;align-items:flex-end}
.trow input{flex:1;min-width:0}
.trow button,.lbtn{min-height:34px;padding:.15em .7em;font-size:13px;flex:0 0 auto}
.lrow{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.lrow label{margin-top:1.1em}
.warnbox{margin-top:10px;border:2px solid var(--warn);color:var(--warn);padding:8px 10px;font-size:13px}
.warnbox button{display:block;width:100%;text-align:left;margin-top:6px;min-height:36px;padding:.2em .6em;font-size:13px;color:var(--ink);border-color:var(--warn)}
.meta{font-size:12px;opacity:.8;margin-top:6px;line-height:1.5}
.tag{display:inline-block;border:1px dashed var(--warn);color:var(--warn);font-size:11px;padding:0 6px;margin-left:6px;vertical-align:2px}
.bar button{font-size:15px;line-height:1.25;padding:.6em .2em}
@media (max-width:460px){header h1{display:none}header .r{gap:6px;width:100%;justify-content:flex-end}}
#map.photo .leaflet-tile-pane{filter:none!important}
/* ---------- v2.1 ---------- */
.cnt{align-items:center}
.cs{display:flex;align-items:center;gap:2px}
.cs button{min-height:34px;padding:2px 8px;border-width:2px;border-color:var(--line);background:none}
.cs .fbtn{width:38px;padding:0;display:flex;align-items:center;justify-content:center}
.cs .fbtn:hover{background:var(--panel)}
.cs .fbtn.on{border-color:var(--ink);background:var(--bg);box-shadow:0 0 0 2px var(--ink)}
.cs .clab{border-color:transparent;font-size:13px;white-space:nowrap}
.cs .clab:hover{background:var(--hi);color:var(--hi-ink)}
.cnt.filtering .cs:not(.sel){opacity:.45}
.fall{min-height:34px;padding:2px 8px;font-size:12px}
.row{flex-wrap:wrap;gap:6px}
.step{gap:6px}
.step button{width:44px;height:44px;padding:0;font-size:15px}
.step .num{width:64px;height:44px;text-align:center;font-size:18px;font-weight:700;padding:0;border:2px solid var(--line);background:var(--bg);-moz-appearance:textfield;appearance:textfield}
.step .num:focus{border-color:var(--ink);background:var(--panel)}
.step .num::-webkit-outer-spin-button,.step .num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pin-ic .pulse{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:no-preference){.pin-ic .pulse{animation:pls 1.8s ease-out infinite}#map.nopulse .pulse{animation:none;opacity:0}}
@keyframes pls{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.7);opacity:0}}
@media (max-width:719px){.sheet{max-height:62%}}
.cfm-msg{margin:0 0 6px;font-size:15px;line-height:1.7}
.mrow .del{color:var(--warn);border-color:var(--warn)}
.mrow .del:hover{background:var(--warn);color:var(--hi-ink)}
/* ---------- v2.2 各隊の位置 ---------- */
.tl3{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tl3 button{min-height:34px;padding:2px 10px;font-size:12px;border-width:2px;border-color:var(--line);background:var(--panel);color:var(--ink)}
.tl3 button.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink);background:var(--panel);color:var(--ink)}
.tl3 button:hover{background:var(--hi);color:var(--hi-ink)}
.nearteams{margin:10px 0 0;padding:8px 10px;border:2px solid var(--line);background:var(--bg)}
.nt-h{font-size:13px;font-weight:700;margin-bottom:4px}
.nt-row{display:flex;gap:12px;align-items:baseline;font-size:15px;padding:2px 0}
.nt-row b{min-width:4em}
.nt-row.old span:last-child{color:var(--warn);font-weight:700}
.nt-none{font-size:13px;opacity:.75}
/* ---------- v2.3 本部/隊員・階数・かんたん操作 ---------- */
.role{margin:10px 0 0;padding:6px 12px 10px;border:2px solid var(--line);background:transparent}
.role legend{font-size:13px;font-weight:700;padding:0 6px}
.rd{display:flex;align-items:center;gap:10px;min-height:44px;margin:0;font-size:16px;font-weight:700;opacity:1}
.rd input{width:22px;height:22px;flex:none;margin:0;padding:0;border:0;accent-color:var(--ink)}
.quick{margin-top:12px}
.qname{font-weight:700;font-size:17px}
.quick .seg button{min-height:84px;white-space:pre-line;line-height:1.5;font-size:16px;font-weight:700}
.dtgl{margin-top:10px;width:100%;display:flex;justify-content:space-between;align-items:center;border-style:dashed}
.lb{display:block;margin:12px 0 0;font-size:13px;font-weight:700;opacity:.9}
.fl{margin-top:16px;padding:12px 14px;border:2px solid var(--ink);background:var(--bg)}
.fl-h{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.fl-h i,.fl-sub i{display:inline-block;width:12px;height:12px;background:var(--ink)}
.fl-hint{font-size:13px;margin:6px 0 0;opacity:.85}
.fl-dim{display:flex;gap:12px;margin-top:6px}
.fl-dim>div{flex:1}
.fl-dim input{text-align:center;font-weight:700;font-size:20px}
.fl-sum{margin-top:12px;font-weight:700}
.fl-bar{display:flex;gap:4px;margin-top:8px}
.fl-bar span{flex:1;height:14px}
.fl-list{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.fl-row{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:0 12px;text-align:left;font-weight:700}
.fl-row .fl-n{font-family:"Share Tech Mono",monospace;font-size:19px;min-width:42px}
.fl-row .fl-s{flex:1}
.fl-row .fl-c{font-family:"Share Tech Mono",monospace;font-size:12px;font-weight:400}
.fl-row .fl-chips{display:flex;gap:2px;align-items:center}
.fl-row.open{background:var(--hi);color:var(--hi-ink)}
.fl-row.sm{min-height:48px;font-size:15px}
.fl-body{padding:6px 12px 14px;border:2px solid var(--ink);border-top:0;background:var(--panel);margin-top:-8px}
.sh-body{padding:4px 10px 12px;border:2px solid var(--ink);border-top:0;background:var(--bg);margin-top:-6px}
.fl-sub{margin-top:16px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
.fl-sub i{width:10px;height:10px}
.autob{margin-top:4px;display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;border:2px solid var(--line);background:var(--bg);font-weight:700}
.autoi{font-family:"Share Tech Mono",monospace;font-size:11px;font-weight:700;letter-spacing:.08em;padding:1px 6px;border:2px solid var(--line);margin-left:6px}
.rules{margin:6px 0 0;font-size:12px;opacity:.85;line-height:1.7}
.tots{display:flex;gap:8px;margin-top:4px}
.tots>div{flex:1;padding:6px;border:2px solid var(--line);background:var(--bg);text-align:center}
.tots small{display:block;font-size:12px}
.tots b{font-family:"Share Tech Mono",monospace;font-size:24px}
.fl-addrow{display:flex;gap:8px;margin-top:12px;align-items:flex-end}
.fl-addrow input{flex:1}
.fl-add{margin-top:10px;width:100%;border-style:dashed}
.fl-del{margin-top:14px;width:100%;color:var(--warn);border-color:var(--warn)}
/* ---------- v2.4 要救助者（V）・写真 ---------- */
.sec{margin-top:18px;border-top:2px solid var(--line);padding-top:10px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec-h b{font-size:14px}
.sec-h button{min-height:38px;padding:.2em .9em;font-size:13px}
.sec-empty{font-size:13px;opacity:.75;margin-top:6px}
.vrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);padding:8px 2px;min-height:48px;background:none;font-weight:400}
.vrow:hover,.vrow:focus-visible{background:var(--bg);color:var(--ink)}
.vrow svg{flex:0 0 auto}
.vrow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vrow small{opacity:.7;white-space:nowrap}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px;margin-top:8px}
.photos button{padding:0;aspect-ratio:1;min-height:0;border:2px solid var(--line);overflow:hidden;background:var(--bg)}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos .up{display:grid;place-items:center;font-size:12px;opacity:.75;border-style:dashed}
.vm .box{max-height:92vh;overflow:auto}
.vm .vst{flex-wrap:wrap}
.vm .vst button{flex:1 1 45%;font-size:13px;padding:.5em .2em}
.vm .vloc button{font-size:13px;padding:.5em .2em}
.vm textarea{min-height:3.2em}
.pv{position:fixed;inset:0;z-index:1006;background:rgba(10,9,6,.94);display:flex;flex-direction:column}
.pv img{flex:1;min-height:0;object-fit:contain;width:100%}
.pv-bar{display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));align-items:center;color:#eee9d2;font-size:13px}
.pv-bar span{flex:1}
.pv-bar button{color:#eee9d2;border-color:#eee9d2;min-height:40px}
.pv-bar .del{color:#ff9a80;border-color:#ff9a80}
/* ---------- v2.6 合計人数・−10/−1・階の写真 ---------- */
.step{flex-wrap:nowrap}
.step button{width:42px}
.step .num{width:58px}
.ptot{margin-top:4px;border:2px solid var(--line);background:var(--bg);padding:4px 8px;min-height:44px}
.ptot b{display:block;font-size:20px;line-height:1.2}
.ptot small{display:block;font-size:12px;opacity:.85;letter-spacing:0;word-spacing:.15em;overflow-wrap:anywhere}
.fl-ph{margin-top:14px;border-top:1px dashed var(--line);padding-top:8px}
.fl-ph .sec-h b{font-size:13px}
/* ---------- v2.7 事前確認用の施設 ---------- */
.tl3 select{min-height:34px;font-size:12px;border-color:var(--line)}
.fac-ic text{font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;font-weight:700;paint-order:normal;stroke:none}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--ink);border-radius:0;box-shadow:0 0 0 2px var(--ink)}
.leaflet-popup-content{margin:12px 14px;font:inherit;font-size:14px;min-width:180px}
.fac-pop small{display:block;opacity:.8;font-size:12px}
.fac-pop b{display:block;font-size:15px;margin:2px 0 8px}
.fac-pop button{width:100%;min-height:40px;font-size:13px}
</style>
</head>
<body>

<section id="auth">

/* ---------- API ---------- */
function api(method,url,body){
  var h={"Content-Type":"application/json"};
  if(user&&user.token)h.Authorization="Bearer "+user.token;
  return fetch(url,{method:method,headers:h,body:body?JSON.stringify(body):undefined})
    .then(function(r){return r.json()["catch"](function(){return{}}).then(function(j){j._status=r.status;if(!r.ok)return Promise.reject(j);return j})},
      function(){return Promise.reject({_net:true})});
}

/* ---------- auth ---------- */
var mode="login";
var ERR_MSG={id_taken:"idTaken",invalid_id:"idRule",weak_password:"pwRule",invalid_credentials:"badCred",missing:"missingIn",bad_hq_code:"badHqCode",hq_disabled:"hqDisabled"};
function setMode(m){mode=m;$("tLogin").classList.toggle("on",m==="login");$("tReg").classList.toggle("on",m==="reg");
  $("fTeam").classList.toggle("hide",m!=="reg");$("fRole").classList.toggle("hide",m!=="reg");$("go").textContent=m==="login"?t("login"):t("startReg");
  $("pw").autocomplete=m==="login"?"current-password":"new-password";$("err").textContent=""}
$("tLogin").onclick=function(){setMode("login")};$("tReg").onclick=function(){setMode("reg")};
function curRole(){var r=document.querySelector('input[name="role"]:checked');return r?r.value:"member"}
$$('input[name="role"]').forEach(function(r){r.onchange=function(){$("fHq").classList.toggle("hide",curRole()!=="hq")}});
function submit(){
  var id=$("uid").value.trim(),pw=$("pw").value,team=$("team").value.trim();
  if(mode==="reg"){
    if(!team)return fail(t("teamReq"));
    if(!/^[A-Za-z0-9_-]{3,20}$/.test(id))return fail(t("idRule"));
    if(pw.length<6)return fail(t("pwRule"));
    var role=curRole(),hq=$("hqc").value;
    if(role==="hq"&&!hq)return fail(t("hqCodeReq"));
    $("go").disabled=true;
    api("POST","/api/register",{id:id,password:pw,team:team,role:role,hqCode:role==="hq"?hq:undefined}).then(enter,authErr)["finally"](function(){$("go").disabled=false});
  }else{
    $("go").disabled=true;
    api("POST","/api/login",{id:id,password:pw}).then(enter,authErr)["finally"](function(){$("go").disabled=false});
  }
}
function authErr(e){fail(e&&ERR_MSG[e.error]?t(ERR_MSG[e.error]):e&&e._net?t("noServer"):t("serverErr",{code:(e&&(e.error||e._status))||"?"}))}
function fail(m){$("err").textContent=m}
$("go").onclick=submit;
["uid","pw","team"].forEach(function(i){$(i).addEventListener("keydown",function(e){if(e.key==="Enter")submit()})});

/* ---------- 同期（10秒ごとの自動更新 + オフライン時の未送信キュー） ---------- */
function qKey(){return "ss_queue_"+(user?user.id:"")}
function cKey(){return "ss_cache_"+(user?user.id:"")}
function queue(){return S.get(qKey())||[]}
function setQueue(q){S.set(qKey(),q)}
/* ---------- 階・店舗・区画（状況の決め方はサーバーと同じ） ---------- */
function statusRule(a){
  if(!a.length)return null;
  if(a.some(function(x){return x===1}))return 1;
  if(a.every(function(x){return x===0}))return 0;
  if(a.every(function(x){return x===2}))return 2;
  return 1;
}
function sumK(list,k){return Math.min(list.reduce(function(a,x){return a+(+x[k]||0)},0),100000)}
function hasFloors(d){return !!(d&&d.floors&&d.floors.length)}
function floorView(f){
  var sh=f.shops||[];
  if(!sh.length)return{status:+f.status||0,live:+f.live||0,dead:+f.dead||0,missing:+f.missing||0,auto:false};
  return{status:statusRule(sh.map(function(x){return +x.status||0})),live:sumK(sh,"live"),dead:sumK(sh,"dead"),missing:sumK(sh,"missing"),auto:true};
}
function applyDerived(d){
  if(!hasFloors(d))return d;
  var vs=d.floors.map(floorView),ents=[];
  d.floors.forEach(function(f){(f.shops&&f.shops.length?f.shops:[f]).forEach(function(e){ents.push(e)})});
  var st=ents.map(function(e){return e.startAt}).filter(Boolean);
  d.status=statusRule(vs.map(function(v){return v.status}));
  d.live=sumK(vs,"live");d.dead=sumK(vs,"dead");d.missing=sumK(vs,"missing");
  d.hazard=ents.map(function(e){return(e.hazard||"").trim()}).filter(function(h,i,a){return h&&a.indexOf(h)===i}).join("／").slice(0,200);
  d.go=ents.every(function(e){return e.go!==false});
  d.startAt=st.length?Math.min.apply(null,st):null;
  d.endAt=ents.every(function(e){return e.endAt})?Math.max.apply(null,ents.map(function(e){return e.endAt})):null;
  return d;
}
// 建物の人数（合計）：階・店舗があればその合計、なければ建物全体の入力値
function peopleOf(d){
  if(hasFloors(d)){var vs=d.floors.map(floorView);return{missing:sumK(vs,"missing"),live:sumK(vs,"live"),dead:sumK(vs,"dead")}}
  return{missing:+d.missing||0,live:+d.live||0,dead:+d.dead||0};
}
function updateTotal(){
  var el=$("ptot");if(!el||!draft)return;
  var v=peopleOf(draft),n=v.missing+v.live+v.dead;
  el.querySelector("b").textContent=t("personsN",{n:n});
  el.querySelector("small").textContent="M"+v.missing+" L"+v.live+" D"+v.dead;
}
function floorsProgress(p){
  if(!hasFloors(p))return"";
  return p.floors.filter(function(f){return floorView(f).status===2}).length+"/"+p.floors.length;
}
function floorsForSend(fl){
  var one=function(e){return{status:+e.status||0,go:e.go!==false,live:+e.live||0,dead:+e.dead||0,missing:+e.missing||0,
    hazard:(e.hazard||"").trim(),note:(e.note||"").trim(),startAt:e.startAt||null,endAt:e.endAt||null}};
  return fl.map(function(f){var o=one(f);o.label=(f.label||"").trim();
    o.shops=(f.shops||[]).map(function(s){var x=one(s);x.id=s.id;x.name=(s.name||"").trim();return x});return o});
}
function pinBody(d){return{lat:d.lat,lng:d.lng,name:d.name,status:d.status,go:d.go,live:d.live,dead:d.dead,missing:d.missing,
  hazard:d.hazard||"",address:d.address||"",floor:d.floor||"",note:d.note||"",startAt:d.startAt||null,endAt:d.endAt||null,
  floors:hasFloors(d)?floorsForSend(d.floors):null}}
function isTmp(id){return typeof id==="string"&&id.indexOf("tmp-")===0}
function enqueue(d){
  var q=queue(),body=pinBody(d),i;
  if(!d.id||isTmp(d.id)){
    if(!d.id)d.id="tmp-"+Date.now();
    for(i=0;i<q.length;i++)if(q[i].tmp===d.id){q[i].body=body;break}
    if(i===q.length)q.push({op:"create",tmp:d.id,body:body});
  }else{
    for(i=0;i<q.length;i++)if(q[i].op==="update"&&q[i].id===d.id){q[i].body=body;break}
    if(i===q.length)q.push({op:"update",id:d.id,body:body});
  }
  setQueue(q);
}
function withQueue(list){
  var q=queue(),byId={};
  list.forEach(function(p){byId[p.id]=p});
  q.forEach(function(e){
    if(e.op==="update"&&byId[e.id]){var p=byId[e.id];for(var k in e.body)p[k]=e.body[k];p._pending=true}
    if(e.op==="create"){var n=JSON.parse(JSON.stringify(e.body));n.id=e.tmp;n.team=user.team;n.by=user.id;n._pending=true;list.push(n)}
  });
  return list;
}
var flushing=null;
function flush(){
  if(flushing)return flushing;
  var q=queue();if(!q.length||!user)return Promise.resolve(false);
  var sentAny=false;
  flushing=q.reduce(function(prev,e){
    return prev.then(function(stop){
      if(stop)return true;
      var req=e.op==="create"?api("POST","/api/pins",e.body):api("PUT","/api/pins/"+e.id,e.body);
      return req.then(function(){drop(e);sentAny=true;return false},function(err){
        if(err&&err._net)return true;               // まだオフライン → 次回再送
        if(err&&err._status===401)return true;
        drop(e);return false;                        // 400/404等は再送しても無駄なので破棄
      });
    });
  },Promise.resolve(false)).then(function(){flushing=null;if(sentAny)toast(t("sent"));return sentAny});
  function drop(e){setQueue(queue().filter(function(x){return !(x.op===e.op&&(x.tmp||x.id)===(e.tmp||e.id))}))}
  return flushing;
}
function sync(){
  if(!user)return;
  flush().then(function(){
    return api("GET","/api/pins").then(function(list){
      online=true;lastSync=Date.now();
      if(draft&&typeof draft.id==="number"&&!draft._warned){
        var cur=list.filter(function(p){return p.id===draft.id})[0];
        if(cur&&cur.t>draft.t&&cur.updatedBy!==user.id){draft._warned=true;toast(t("otherUpdated"),4000)}
      }
      var raw=JSON.parse(JSON.stringify(list));
      pins=withQueue(list);render();renderNet();fetchPositions();
      api("GET","/api/victims").then(function(vl){
        victims=vl;renderVictims();renderVictimList();
        S.set(cKey(),{pins:raw,victims:vl,t:lastSync});
      },function(){S.set(cKey(),{pins:raw,victims:victims,t:lastSync})});
    },function(e){
      if(e&&e._status===401){toast(t("sessionExpired"));logout();return}
      if(e&&e._net){online=false;pins=withQueue(pins.filter(function(p){return !p._pending||!isTmp(p.id)}));render();renderNet();return}
      toast(t("loadFail"));
    });
  });
}
function renderNet(){
  var n=queue().length,el=$("net");
  el.classList.toggle("off",!online);
  var ls=lastSync?new Date(lastSync).toLocaleTimeString(t("locale"),{hour:"2-digit",minute:"2-digit",second:"2-digit"}):"";
  el.innerHTML='<i></i><span>'+esc(online?t("synced",{time:ls||"--"}):ls?t("offlineSince",{time:ls}):t("offline"))+'</span>'+
    (n?' <b>'+esc(t("pending",{n:n}))+'</b>':'');
}

/* ---------- geo ---------- */
function getPos(){return new Promise(function(res,rej){
  if(!navigator.geolocation)return rej();
  navigator.geolocation.getCurrentPosition(function(p){res({lat:p.coords.latitude,lng:p.coords.longitude})},rej,{enableHighAccuracy:true,timeout:8000,maximumAge:5000})})}
function locate(center){
  getPos().then(function(p){
    gps=p;showGps(p);
    if(center)map.setView([p.lat,p.lng],Math.max(map.getZoom(),17));
  },function(){gps=null;if(!center)toast(t("gpsFail"))});
}
function distM(a,b){
  var R=6371000,r=Math.PI/180,dLat=(b.lat-a.lat)*r,dLng=(b.lng-a.lng)*r;
  var h=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return 2*R*Math.asin(Math.sqrt(h));
}

function glyph(st,r,col){

function pinSVG(p,detailed){

    return '<svg width="20" height="20" viewBox="-10 -10 20 20"><circle r="7" fill="'+col+'" stroke="'+ring+'" stroke-width="2"'+dash+'/></svg>';
  }

    tx(0,53,12,(p.name||"")+(p.floor?" "+p.floor:"")+(floorsProgress(p)?" "+floorsProgress(p):""))+'</svg>';

  return m<60?t("agoMin",{n:m}):t("agoHour",{n:Math.floor(m/60)});

// 編集画面：この現場に近い隊（応援の候補）を、距離の近い順に最大3隊
function updateNearest(){
  var el=$("nearteams");if(!el||!draft)return;
  var ex=draft.team||(user&&user.team),best={};
  teamPos.forEach(function(p){
    if(p.team===ex)return;
    var d=distM(p,draft);
    if(!best[p.team]||d<best[p.team].d)best[p.team]={p:p,d:d};
  });
  var list=Object.keys(best).map(function(k){return best[k]}).sort(function(a,b){return a.d-b.d}).slice(0,3);

function sendPos(cur){

    gps={lat:cur.lat,lng:cur.lng};showGps(gps);

}

/* ---------- 事前確認用の施設（学校・工場・発電所・大型商業施設：OpenStreetMapのデータ） ---------- */
var FAC_Z=14,FAC_MINZOOM=15,FAC_TTL=7*24*3600*1000,FAC_KEEP=80;
var FAC_KINDS=["school","factory","power","mall"];
var FAC_STYLE={school:{c:"#2c6fbf",ja:"学",en:"S"},factory:{c:"#8a5a1f",ja:"工",en:"F"},power:{c:"#c27c00",ja:"電",en:"P"},mall:{c:"#8a3fa0",ja:"商",en:"M"}};
var facKind=S.get("ss_fac")||"all",facTiles={},facLoading={},facTimer=null,facHinted=false;
var facLayer=L.layerGroup().addTo(map);
(function(){ // 端末に保存した施設データ（オフラインでも表示できるように）
  var c=S.get("ss_fac_tiles")||{},now=Date.now();
  Object.keys(c).forEach(function(k){if(c[k]&&now-c[k].t<FAC_TTL)facTiles[k]=c[k]});
})();
function saveFac(){
  var ks=Object.keys(facTiles).sort(function(a,b){return facTiles[b].t-facTiles[a].t}).slice(0,FAC_KEEP),o={};
  ks.forEach(function(k){o[k]=facTiles[k]});S.set("ss_fac_tiles",o);
}
function facTilesInView(){
  var b=map.getBounds(),n=Math.pow(2,FAC_Z),out=[];
  var tx=function(lng){return Math.floor((lng+180)/360*n)};
  var ty=function(lat){var r=lat*Math.PI/180;return Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n)};
  var x0=tx(b.getWest()),x1=tx(b.getEast()),y0=ty(b.getNorth()),y1=ty(b.getSouth());
  for(var x=x0;x<=x1;x++)for(var y=y0;y<=y1;y++)if(out.length<16)out.push(FAC_Z+"/"+x+"/"+y);
  return out;
}
function facOn(){return !!user&&facKind!=="off"}
function loadFacilities(){
  if(!facOn())return renderFac();
  if(map.getZoom()<FAC_MINZOOM){
    if(!facHinted){facHinted=true;toast(t("facZoom"),3000)}
    return renderFac();
  }
  facTilesInView().forEach(function(k){
    if(facTiles[k]||facLoading[k])return;
    facLoading[k]=true;
    api("GET","/api/facilities?tile="+k).then(function(r){facTiles[k]={t:Date.now(),items:r.items||[]};saveFac();renderFac()},function(){})
      .then(function(){delete facLoading[k]});
  });
  renderFac();
}
function facIcon(kind){
  var st=FAC_STYLE[kind],ch=lang==="ja"?st.ja:st.en;
  return L.divIcon({className:"pin-ic fac-ic",iconSize:[26,26],iconAnchor:[13,13],
    html:'<svg width="26" height="26" viewBox="-13 -13 26 26"><rect x="-11" y="-11" width="22" height="22" rx="3" fill="'+st.c+'" stroke="var(--panel)" stroke-width="2"/>'+
      '<text y="5" text-anchor="middle" font-size="14" style="fill:#fff">'+ch+'</text></svg>'});
}
function facName(f){return(lang==="en"&&f.nameEn)||f.name||t("facNoName")}
function renderFac(){
  facLayer.clearLayers();
  var attr=t("facAttr")+' &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>';
  map.attributionControl.removeAttribution(I18N.ja.facAttr+' &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>');
  map.attributionControl.removeAttribution(I18N.en.facAttr+' &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>');
  if(!facOn()||map.getZoom()<FAC_MINZOOM)return;
  map.attributionControl.addAttribution(attr);
  var bb=map.getBounds().pad(0.3),seen={};
  Object.keys(facTiles).forEach(function(k){(facTiles[k].items||[]).forEach(function(f){
    if(seen[f.id]||(facKind!=="all"&&f.kind!==facKind)||!FAC_STYLE[f.kind]||!bb.contains([f.lat,f.lng]))return;
    seen[f.id]=1;
    var m=L.marker([f.lat,f.lng],{icon:facIcon(f.kind),zIndexOffset:-500,title:facName(f)});
    m.on("click",function(e){
      if(vplacing){placeVictimAt(e.latlng);return}
      var sub=I18N[lang]["s_"+f.sub]||t("k_"+f.kind);
      var el=document.createElement("div");el.className="fac-pop";
      el.innerHTML='<small>'+esc(t("k_"+f.kind)+(sub!==t("k_"+f.kind)?" · "+sub:""))+'</small><b>'+esc(facName(f))+'</b><button type="button" class="solid">'+esc(t("facPin"))+'</button>';
      el.querySelector("button").onclick=function(){
        map.closePopup();
        var go=function(){var d=blank({lat:f.lat,lng:f.lng});d.name=facName(f)===t("facNoName")?"":facName(f);openSheet(d)};
        if($("sheet")&&isDirty())confirmDiscard("move",go);else go();
      };
      // 左上の表示・右のボタンに隠れないよう、地図を自動で動かしてポップアップを見える位置に出す
      var tl=$$(".tl")[0],top=tl?tl.offsetTop+tl.offsetHeight+12:80;
      L.popup({offset:[0,-8],maxWidth:260,autoPan:true,autoPanPaddingTopLeft:L.point(12,top),autoPanPaddingBottomRight:L.point(64,16)})
        .setLatLng([f.lat,f.lng]).setContent(el).openOn(map);
    });
    facLayer.addLayer(m);
  })});
}
function renderFacSel(){
  var opts=[["all","facAll"],["school","facSchool"],["factory","facFactory"],["power","facPower"],["mall","facMall"],["off","facOff"]];
  $("facSel").innerHTML=opts.map(function(o){return '<option value="'+o[0]+'"'+(o[0]===facKind?" selected":"")+'>'+esc(t(o[1]))+'</option>'}).join("");

  if(act==="stab"){var key=f+"."+s;so[key]=!so[key];return renderFloors()}
  if(act==="addshop")return addShop(+f);
  if(act==="delshop")return confirmBox("delTitle","delShopMsg","keepEditing","delOk",function(){
    draft.floors[+f].shops.splice(+s,1);Object.keys(so).forEach(function(k){if(k.indexOf(f+".")===0)delete so[k]});renderFloors()});

/* ---------- 要救助者（INSARAGの「V」マーク） ---------- */
// status: 0=要救助者の可能性(V) / 1=生存確認(L) / 2=死亡確認(D) / 3=救出・搬出済み
var V_COL=["var(--st0)","var(--st0)","var(--ink)","var(--st2)"],V_TXT=["V","L","D","V"];
var victimLayer=L.layerGroup().addTo(map);
function vGlyph(st,r){
  st=V_COL[st]?st:0;var col=V_COL[st];
  return '<circle r="'+r+'" fill="var(--panel)" stroke="'+col+'" stroke-width="2.5"'+(st===0?' stroke-dasharray="4 2"':'')+'/>'+
    '<text y="'+(r*0.45).toFixed(1)+'" text-anchor="middle" font-size="'+(r*1.3).toFixed(1)+'" style="fill:'+col+';stroke:none;font-family:\'Share Tech Mono\',monospace;font-weight:700">'+V_TXT[st]+'</text>'+
    (st===3?'<line x1="'+(-r*0.75)+'" y1="'+(r*0.75)+'" x2="'+(r*0.75)+'" y2="'+(-r*0.75)+'" stroke="'+col+'" stroke-width="2.5"/>':'');
}
function vIconSVG(st,r){var w=2*r+6;return '<svg width="'+w+'" height="'+w+'" viewBox="'+(-w/2)+' '+(-w/2)+' '+w+' '+w+'">'+vGlyph(st,r)+'</svg>'}
function vLabel(v){return t("vs"+v.status)+(v.floor?" · "+v.floor:"")+(v.note?" · "+v.note:"")}
function renderVictims(){
  victimLayer.clearLayers();
  if(!user)return;
  var ids={};onMap().forEach(function(p){ids[p.id]=1});
  victims.forEach(function(v){
    if(!ids[v.pinId])return;   // 絞り込みで隠れている建物のVは出さない
    var m=L.marker([v.lat,v.lng],{zIndexOffset:1500,title:vLabel(v),
      icon:L.divIcon({html:vIconSVG(+v.status,11),className:"pin-ic",iconSize:[28,28],iconAnchor:[14,14]})});
    m.on("click",function(e){if(vplacing){placeVictimAt(e.latlng);return}openVictim(JSON.parse(JSON.stringify(v)))});
    victimLayer.addLayer(m);
  });
}
function canAttach(d){return d&&typeof d.id==="number"}
function renderVictimList(){
  var el=$("vsec");if(!el||!draft)return;
  if(!canAttach(draft)){el.innerHTML='<div class="sec-h"><b>'+esc(t("victims"))+' / '+esc(t("photos"))+'</b></div><div class="sec-empty">'+esc(t("vSaveFirst"))+'</div>';return}
  var list=victims.filter(function(v){return v.pinId===draft.id});
  el.innerHTML='<div class="sec-h"><b>'+esc(t("victims"))+' <span class="mono">'+list.length+'</span></b><button type="button" id="vadd">'+esc(t("vAdd"))+'</button></div>'+
    (list.length?list.map(function(v){return '<button type="button" class="vrow" data-vid="'+v.id+'">'+vIconSVG(+v.status,10)+'<span>'+esc(vLabel(v))+'</span><small class="mono">'+esc(fmtTime(v.t))+'</small></button>'}).join(""):
      '<div class="sec-empty">'+esc(t("vNone"))+'</div>');
  $("vadd").onclick=function(){openVictim({pinId:draft.id,lat:draft.lat,lng:draft.lng,floor:draft.floor||"",status:0,note:""})};
  Array.prototype.forEach.call(el.querySelectorAll("[data-vid]"),function(b){
    b.onclick=function(){var v=victims.filter(function(x){return String(x.id)===b.getAttribute("data-vid")})[0];if(v)openVictim(JSON.parse(JSON.stringify(v)))};
  });
}
function closeVictim(){var el=$("vm");if(el)el.remove()}
function openVictim(v){
  closeVictim();
  var isNew=!v.id,own=user&&v.team===user.team;
  var el=document.createElement("div");el.className="modal vm";el.id="vm";
  var seg=function(cls,items,cur,attr){return '<div class="seg '+cls+'">'+items.map(function(x){return '<button type="button" '+attr+'="'+x[0]+'"'+(String(cur)===String(x[0])?' class="on"':'')+'>'+esc(x[1])+'</button>'}).join("")+'</div>'};
  var meta=isNew?"":'<div class="meta">'+esc(t("created"))+': '+esc((v.team||"")+" / "+(v.by||""))+(v.t?'<br>'+esc(t("updated"))+': '+esc((v.updatedBy||v.by||"")+" · "+fmtTime(v.t)):"")+'</div>';
  el.innerHTML='<div class="box" role="dialog" aria-modal="true" aria-labelledby="vmT"><h1 id="vmT">'+esc(isNew?t("vNew"):t("vEdit"))+'</h1>'+
    '<div class="co mono" id="vmCo"></div>'+meta+
    '<label>'+esc(t("vPlace"))+'</label>'+seg("vloc",[["pin",t("vAtPin")],["gps",t("vAtGps")],["map",t("vAtMap")]],"","data-loc")+
    '<label>'+esc(t("status"))+'</label>'+seg("vst",[[0,t("vs0")],[1,t("vs1")],[2,t("vs2")],[3,t("vs3")]],v.status,"data-vs")+
    '<label for="vmF">'+esc(t("floor"))+'</label><input id="vmF" placeholder="'+esc(t("floorPh"))+'">'+
    '<label for="vmN">'+esc(t("note"))+'</label><textarea id="vmN" rows="2" placeholder="'+esc(t("vNotePh"))+'"></textarea>'+
    '<div class="mrow"><button type="button" id="vmC">'+esc(t("cancel"))+'</button><button type="button" class="solid" id="vmS">'+esc(t("save"))+'</button></div>'+
    (!isNew&&own?'<div class="mrow"><button type="button" class="del" id="vmD">'+esc(t("del"))+'</button></div>':'')+'</div>';
  document.body.appendChild(el);
  $("vmF").value=v.floor||"";$("vmN").value=v.note||"";
  var showCo=function(){$("vmCo").textContent=(+v.lat).toFixed(5)+", "+(+v.lng).toFixed(5)};showCo();
  var collect=function(){v.floor=$("vmF").value.trim();v.note=$("vmN").value.trim()};
  var onKey=function(e){if(e.key==="Escape"){e.preventDefault();done()}};
  var done=function(){document.removeEventListener("keydown",onKey);closeVictim()};
  document.addEventListener("keydown",onKey);
  el.addEventListener("click",function(e){
    if(e.target===el){done();return}
    var b=e.target.closest("button");if(!b)return;
    if(b.hasAttribute("data-vs")){v.status=+b.getAttribute("data-vs");Array.prototype.forEach.call(b.parentNode.children,function(x){x.classList.toggle("on",x===b)});return}
    var loc=b.getAttribute("data-loc");
    if(loc==="pin"){var p=pins.filter(function(x){return x.id===v.pinId})[0];if(p){v.lat=p.lat;v.lng=p.lng;showCo()}}
    else if(loc==="gps"){getPos().then(function(g){v.lat=g.lat;v.lng=g.lng;if($("vm"))showCo()},function(){toast(t("gpsFail"))})}
    else if(loc==="map"){collect();done();startVPlacing(v)}
  });
  $("vmC").onclick=done;
  $("vmS").onclick=function(){
    collect();
    var body={lat:v.lat,lng:v.lng,floor:v.floor,status:v.status,note:v.note};
    var req=v.id?api("PUT","/api/victims/"+v.id,body):api("POST","/api/pins/"+v.pinId+"/victims",body);
    $("vmS").disabled=true;
    req.then(function(saved){
      var found=false;victims=victims.map(function(x){if(x.id===saved.id){found=true;return saved}return x});
      if(!found)victims.push(saved);
      done();renderVictims();renderVictimList();toast(t("saved"));
    },function(e){if($("vmS"))$("vmS").disabled=false;toast(e&&e._net?t("offlineNoSave"):t("saveFail"))});
  };
  if($("vmD"))$("vmD").onclick=function(){
    api("DELETE","/api/victims/"+v.id).then(function(){
      victims=victims.filter(function(x){return x.id!==v.id});done();renderVictims();renderVictimList();toast(t("deleted"));
    },function(e){toast(e&&e._status===403?t("delOther"):e&&e._net?t("offlineNoSave"):t("delFail"))});
  };
  $("vmS").focus();
}
// 地図でVの位置を指定：編集画面は一時的に隠し、タップした地点で入力画面に戻る
function startVPlacing(v){
  vplacing=v;setPlacing(false);
  var sh=$("sheet");if(sh)sh.classList.add("hide");
  $("hint").textContent=t("vTapMap");$("hint").classList.remove("hide");
}
function endVPlacing(){
  vplacing=null;$("hint").textContent=t("tapMap");$("hint").classList.toggle("hide",!placing);
  var sh=$("sheet");if(sh)sh.classList.remove("hide");
}
function placeVictimAt(ll){var v=vplacing;endVPlacing();v.lat=ll.lat;v.lng=ll.lng;openVictim(v)}

/* ---------- 建物の写真 ---------- */
var PHOTO_MAX=1024*1024;
function authHdr(){return user&&user.token?{Authorization:"Bearer "+user.token}:{}}
function photoURL(id){
  if(photoURLs[id])return Promise.resolve(photoURLs[id]);
  return fetch("/api/photos/"+id,{headers:authHdr()}).then(function(r){if(!r.ok)throw r;return r.blob()})
    .then(function(b){return(photoURLs[id]=URL.createObjectURL(b))});
}
// 端末側で長辺1600pxに縮小し、JPEGで約0.9MB以下にしてから送る（通信量とDBの容量を節約）
function shrink(file){return new Promise(function(res,rej){
  var url=URL.createObjectURL(file),img=new Image();
  img.onload=function(){
    var M=1600,w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,M/Math.max(w,h));
    var cv=document.createElement("canvas");cv.width=Math.max(1,Math.round(w*k));cv.height=Math.max(1,Math.round(h*k));
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);
    var qs=[0.8,0.65,0.5],i=0;
    (function next(){cv.toBlob(function(b){if(!b)return rej();if(b.size<=900*1024||i>=qs.length-1)res(b);else{i++;next()}},"image/jpeg",qs[i])})();
  };
  img.onerror=function(){URL.revokeObjectURL(url);rej()};
  img.src=url;
})}
var curPhotos=[],photoPin=null,uploading={};   // uploading: 送信中の枚数（キー＝階のラベル、建物全体は ""）
function renderPhotos(d){
  var el=$("phsec");if(!el)return;
  if(!canAttach(d)){el.classList.add("hide");el.innerHTML="";return}
  el.classList.remove("hide");
  if(photoPin!==d.id){photoPin=d.id;curPhotos=[];
    api("GET","/api/pins/"+d.id+"/photos").then(function(list){if(photoPin===d.id){curPhotos=list;drawPhotos()}},function(){});
  }
  el.innerHTML='<div class="sec-h"><b>'+esc(t("photos"))+' <span class="mono" id="phN"></span></b><button type="button" id="phAdd">'+esc(t("phAdd"))+'</button></div>'+
    '<input type="file" id="phIn" accept="image/*" multiple class="hide"><div class="photos" id="phList"></div>';
  $("phAdd").onclick=function(){$("phIn").click()};
  $("phIn").onchange=function(){var fs=Array.prototype.slice.call(this.files||[]);this.value="";fs.forEach(function(f){upload(d.id,f)})};
  drawPhotos();
}
function floorLabels(){return hasFloors(draft)?draft.floors.map(function(f){return f.label}):[]}
// 建物全体の写真欄：階のない写真と、削除された階の写真（見えなくならないように）
function bldPhotos(){var ls=floorLabels();return curPhotos.filter(function(ph){return !ph.floor||ls.indexOf(ph.floor)<0})}
function fillPhotos(el,list,key){
  var up=uploading[key]||0;
  el.innerHTML=list.map(function(ph){return '<button type="button" data-ph="'+ph.id+'" aria-label="'+esc(t("photos")+" "+(ph.floor?ph.floor+" ":"")+fmtTime(ph.t))+'"></button>'}).join("")+
    (up?'<button type="button" class="up" disabled>'+esc(t("phUploading"))+'</button>':'')+
    (!list.length&&!up?'<div class="sec-empty">'+esc(t("phNone"))+'</div>':'');
  list.forEach(function(ph){
    var b=el.querySelector('[data-ph="'+ph.id+'"]');
    photoURL(ph.id).then(function(u){if(b.isConnected){var im=new Image();im.alt="";im.src=u;b.appendChild(im)}},function(){b.textContent="!"});
    b.onclick=function(){openPhoto(ph)};
  });
}
function drawPhotos(){
  var el=$("phList");
  if(el){var bl=bldPhotos();$("phN").textContent=bl.length;fillPhotos(el,bl,"")}
  drawFloorPhotos();
}
// 各階のタブの中の写真欄
function drawFloorPhotos(){
  $$("#flbox [data-fph]").forEach(function(box){
    var f=draft&&draft.floors&&draft.floors[+box.getAttribute("data-fph")];if(!f)return;
    if(!canAttach(draft)){box.innerHTML='<div class="sec-empty">'+esc(t("floorPhSave"))+'</div>';return}
    var list=curPhotos.filter(function(ph){return ph.floor===f.label});
    box.innerHTML='<div class="sec-h"><b>'+esc(t("floorPhotos"))+' <span class="mono">'+list.length+'</span></b><button type="button" data-phadd="1">'+esc(t("phAdd"))+'</button></div>'+
      '<input type="file" accept="image/*" multiple class="hide" data-phin="1"><div class="photos"></div>';
    var inp=box.querySelector("[data-phin]"),pid=draft.id,label=f.label;
    box.querySelector("[data-phadd]").onclick=function(){inp.click()};
    inp.onchange=function(){var fs=Array.prototype.slice.call(this.files||[]);this.value="";fs.forEach(function(x){upload(pid,x,label)})};
    fillPhotos(box.querySelector(".photos"),list,label);
  });
}
function upload(pinId,file,floor){
  var key=floor||"";uploading[key]=(uploading[key]||0)+1;drawPhotos();
  shrink(file).then(function(blob){
    if(blob.size>PHOTO_MAX)throw{tooBig:true};
    return fetch("/api/pins/"+pinId+"/photos"+(floor?"?floor="+encodeURIComponent(floor):""),{method:"POST",headers:Object.assign({"Content-Type":"image/jpeg"},authHdr()),body:blob})
      .then(function(r){return r.json()["catch"](function(){return{}}).then(function(j){if(!r.ok)throw j;photoURLs[j.id]=URL.createObjectURL(blob);return j})},
        function(){throw{_net:true}});
  }).then(function(ph){
    if(photoPin===pinId)curPhotos.push(ph);
  },function(e){toast(e&&e.tooBig||e&&e.error==="too_large"?t("phTooBig"):e&&e._net?t("offlineNoSave"):t("phFail"))})
  .then(function(){uploading[key]--;drawPhotos()});
}
function closePhoto(){var el=$("pv");if(el)el.remove()}
function openPhoto(ph){
  closePhoto();
  var el=document.createElement("div");el.className="pv";el.id="pv";el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");
  var own=user&&ph.team===user.team;
  el.innerHTML='<img alt=""><div class="pv-bar"><span>'+esc((ph.floor?ph.floor+" · ":"")+(ph.team||"")+" / "+(ph.by||"")+" · "+fmtTime(ph.t))+'</span>'+
    (own?'<button type="button" class="del" id="pvD">'+esc(t("del"))+'</button>':'')+'<button type="button" id="pvX">'+esc(t("close"))+'</button></div>';
  document.body.appendChild(el);
  photoURL(ph.id).then(function(u){el.querySelector("img").src=u},function(){toast(t("phLoadFail"))});
  var onKey=function(e){if(e.key==="Escape"){e.preventDefault();done()}};
  var done=function(){document.removeEventListener("keydown",onKey);closePhoto()};
  document.addEventListener("keydown",onKey);
  $("pvX").onclick=done;$("pvX").focus();
  if($("pvD"))$("pvD").onclick=function(){
    api("DELETE","/api/photos/"+ph.id).then(function(){
      curPhotos=curPhotos.filter(function(x){return x.id!==ph.id});done();drawPhotos();toast(t("deleted"));
    },function(e){toast(e&&e._status===403?t("delOther"):e&&e._net?t("offlineNoSave"):t("delFail"))});
  };
}

var tt;function toast(m,ms){var x=document.querySelector(".toast");if(x)x.remove();x=document.createElement("div");x.className="toast";x.textContent=m;$("stage").appendChild(x);clearTimeout(tt);tt=setTimeout(function(){x.remove()},ms||2200)}

/* ---------- テーマ・共有 ---------- */
var th0=S.get("ss_theme");if(th0)document.documentElement.setAttribute("data-theme",th0);
$("th").onclick=function(){var r=document.documentElement,dk=getComputedStyle(r).getPropertyValue("--bg").trim()==="#1c1b17",n=dk?"light":"dark";r.setAttribute("data-theme",n);S.set("ss_theme",n);render()};
var shareOpen=function(){
  var url=location.origin+location.pathname;$("su").value=url;
  var box=$("qrbox");box.innerHTML="";
  try{new QRCode(box,{text:url,width:180,height:180,correctLevel:QRCode.CorrectLevel.M})}
  catch(e){box.textContent=t("qrFail")}
  $("modal").classList.remove("hide");
};
$("zq").onclick=shareOpen;$("shA").onclick=shareOpen;
$("sx").onclick=function(){$("modal").classList.add("hide")};
$("modal").addEventListener("click",function(e){if(e.target===this)this.classList.add("hide")});
$("su").onclick=function(){this.select()};
$("sc").onclick=function(){var b=this,i=$("su");i.select();
  var ok=function(){b.textContent=t("copied");setTimeout(function(){b.textContent=t("copy")},1500)};
  try{navigator.clipboard.writeText(i.value).then(ok,function(){try{document.execCommand("copy")&&ok()}catch(e){}})}catch(e){try{document.execCommand("copy")&&ok()}catch(_){}}};

/* ---------- boot ---------- */
// オフラインでもアプリを開けるように service worker を登録（sw.js）
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener("load",function(){navigator.serviceWorker.register("/sw.js")["catch"](function(){})});
}
applyI18n();
var ses=S.get("ss_session");
if(ses&&ses.token){enter(ses)}
})();
